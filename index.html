<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reino de Fantasía 3D</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="player-stats">
      <div class="bar-label">Nivel <span id="level">1</span></div>
      <div class="bar hp-bar"><div id="hp-fill" class="bar-fill"></div></div>
      <div class="bar xp-bar"><div id="xp-fill" class="bar-fill"></div></div>
    </div>
    <div id="kill-counter">Enemigos derrotados: <span id="kills">0</span></div>
  </div>

  <div id="crosshair"></div>

  <div id="instructions">
    <strong>WASD</strong> moverte &nbsp;|&nbsp;
    <strong>Click + arrastrar</strong> mirar alrededor &nbsp;|&nbsp;
    <strong>Espacio</strong> atacar
  </div>

  <div id="death-screen" class="hidden">
    <h1>Has caído en batalla</h1>
    <button id="respawn-btn">Reaparecer</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
