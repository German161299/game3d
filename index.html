<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Reino de Fantasía 3D</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading-screen">
    <div class="loading-spinner"></div>
    <p>Cargando Reino de Fantasía…</p>
  </div>

  <div id="rotate-wrapper">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div id="player-stats">
        <div class="bar-label">Nivel <span id="level">1</span></div>
        <div class="bar hp-bar">
          <div id="hp-fill" class="bar-fill"></div>
          <span id="hp-text" class="bar-text">100 / 100</span>
        </div>
        <div class="bar xp-bar">
          <div id="xp-fill" class="bar-fill"></div>
          <span id="xp-text" class="bar-text">0 / 50</span>
        </div>
      </div>
      <div id="kill-counter">Enemigos derrotados: <span id="kills">0</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="death-screen" class="hidden">
      <h1>Has caído en batalla</h1>
      <button id="respawn-btn">Reaparecer</button>
    </div>

    <div id="mobile-controls" class="hidden">
      <div id="joystick-base"><div id="joystick-knob"></div></div>
      <button id="attack-button" aria-label="Atacar">⚔</button>
    </div>

    <button id="flip-rotation-button" class="hidden" aria-label="Invertir rotación de pantalla">⇄</button>
    <button id="edit-controls-button" class="hidden" aria-label="Editar controles">⚙</button>
    <button id="quality-button" aria-label="Calidad gráfica">🎨</button>

    <div id="quality-panel" class="hidden">
      <span>Calidad gráfica</span>
      <button data-quality="low">Bajo</button>
      <button data-quality="medium">Medio</button>
      <button data-quality="high">Alto</button>
    </div>

    <div id="edit-controls-toolbar" class="hidden">
      <span>Arrastrá el joystick o el botón de ataque para moverlos</span>
      <div class="edit-controls-buttons">
        <button id="reset-controls-btn">↺ Restablecer</button>
        <button id="done-controls-btn">✓ Listo</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
